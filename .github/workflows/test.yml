name: Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest 
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: cmd
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio python-multipart  

      - name: Run tests and Generate Log File
        shell: cmd
        run: |
          cd backend
          for /f %%i in ('powershell -NoProfile -Command "$start = Get-Date '2026-04-07'; $now = Get-Date; ($now - $start).Days + 1"') do set DIFF_DAYS=%%i

          echo DIFF_DAYS=%DIFF_DAYS%

          set HH=%TIME:~0,2%
          if "%HH:~0,1%"==" " set HH=0%HH:~1,1%

          set LOG=test_log_day%DIFF_DAYS%_%DATE:~0,4%%DATE:~5,2%%DATE:~8,2%_%TIME:~0,2%%TIME:~3,2%.txt

          pytest test_homework_system.py -v --asyncio-mode=auto > %LOG% || exit /b 0

          echo DIFF_DAYS=%DIFF_DAYS% >> %GITHUB_ENV%
      
      - name: Run Robotiive Tasks (ordered + single log)
        shell: cmd 
        run: |
          setlocal enabledelayedexpansion
          cd backend

          set HH=%TIME:~0,2%
          if "%HH:~0,1%"==" " set HH=0%HH:~1,1%

          set LOG=robotiive_log_day${{ env.DIFF_DAYS }}_%DATE:~0,4%%DATE:~5,2%%DATE:~8,2%_%TIME:~0,2%%TIME:~3,2%%TIME:~6,2%.txt
          set FAIL=0

          echo ============================== > %LOG%
          echo Robotiive Test Start >> %LOG%
          echo ============================== >> %LOG%

          for %%T in (
            test_create_semester_success
            test_create_semester_invalid_date_range_returns_400
            test_create_duplicate_semester_returns_400
            test_delete_semester
            test_create_course_success
            test_create_duplicate_course_returns_400
            test_delete_course
            test_create_homework_success
          ) do (

            echo. >> %LOG%
            echo Running %%T... >> %LOG%
            echo ------------------------------ >> %LOG%

            ..\tools\Robotiive_runner.exe term_project %%T >> %LOG% 2>&1

            if errorlevel 1 (
                echo [FAIL] %%T >> %LOG%
                set FAIL=1
            ) else (
                echo [PASS] %%T >> %LOG%
            )
          )

          echo. >> %LOG%
          echo ============================== >> %LOG%

          if !FAIL!==0 (
              echo ALL TASKS PASSED >> %LOG%
          ) else (
              echo SOME TASKS FAILED >> %LOG%
          )

          echo ============================== >> %LOG%

          exit /b !FAIL!

      - name: Auto Commit and Push Log
        # 只有在「非 PR」的情況下才自動 Push，避免 PR 期間產生過多重複 Commit
        if: github.event_name != 'pull_request'
        shell: cmd
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add backend\test_log_*.txt
          git add backend\robotiive_log_*.txt
          
          git diff --staged --quiet
          if %ERRORLEVEL%==0 (
            echo No new logs to commit.
          ) else (
            git commit -m "test_log day${{ env.DIFF_DAYS }} [skip ci]"
            git push
          )
