name: Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio python-multipart  

      - name: Run tests and Generate Log File
        run: |
          cd backend
          export TZ='Asia/Taipei'
          START_DATE="2026-04-07"
          START_SEC=$(date -d "$START_DATE" +%s)
          NOW_SEC=$(date +%s)
          DIFF_DAYS=$(( (NOW_SEC - START_SEC) / 86400 + 1 ))
          
          # 修正點：加上 $ 並移除空格
          FILENAME="test_log_day${DIFF_DAYS}_$(date +%Y%m%d_%H%M%S).txt"
          pytest test_homework_system.py -v --asyncio-mode=auto > $FILENAME || true
          
          # 將天數傳給下一步
          echo "DIFF_DAYS=${DIFF_DAYS}" >> $GITHUB_ENV

      - name: Auto Commit and Push Log
        # 只有在「非 PR」的情況下才自動 Push，避免 PR 期間產生過多重複 Commit
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add backend/test_log_*.txt
          
          if git diff --staged --quiet; then
            echo "No new logs to commit."
          else
            # 加上 [skip ci] 避免無限迴圈
            git commit -m "test_log day${{ env.DIFF_DAYS }}_$(date +%Y%m%d_%H%M%S) [skip ci]"
            git push
          fi
