name: Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允許從 GitHub 網頁手動點擊執行
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # 賦予寫入權限，以便將 Log 推回 Repo
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 已升級 v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5 # 已升級 v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio python-multipart  

      - name: Run tests and Generate Log File
        run: |
          cd backend
          export TZ='Asia/Taipei'
          # 加入 || true 是關鍵：即使測試失敗（Exit Code 1），也會繼續執行後續步驟
          pytest test_homework_system.py -v --asyncio-mode=auto > test_log_$(date +%Y%m%d_%H%M%S).txt || true
        
      - name: Auto Commit and Push Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 加入檔案並檢查是否有變動
          git add backend/test_log_*.txt
          
          if git diff --staged --quiet; then
            echo "No new logs to commit."
          else
            git commit -m "test_log_$(date +%Y%m%d_%H%M%S)"
            git push
          fi
